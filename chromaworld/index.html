<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromaWorld - Live Map</title>
    
    <script src="https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.js"></script>
    <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <!-- Top Controls Overlay -->
    <div class="top-controls">
        <button id="toggle-colors-btn" class="glass-btn" title="Farben umschalten">
            <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
        </button>

        <div class="segmented-picker">
            <button class="picker-btn active" data-style="hybrid">Hybrid</button>
            <button class="picker-btn" data-style="satellite">Satellit</button>
            <button class="picker-btn" data-style="standard">Standard</button>
        </div>
    </div>

    <!-- North / Compass Button -->
    <button id="reset-north-btn" class="glass-btn north-btn hidden" title="Nach Norden ausrichten">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="compass-arrow">
            <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
        </svg>
    </button>

    <!-- Bottom Sheet Details -->
    <div id="detail-sheet" class="detail-sheet hidden">
        <div class="sheet-top-bar">
            <div class="sheet-handle"></div>
            <button id="close-sheet-btn" class="close-btn" title="Schließen">&times;</button>
        </div>
        
        <div class="sheet-header">
            <div>
                <h2 id="sheet-color-name">Loading...</h2>
                <span id="sheet-hex-code" class="monospaced">#000000</span>
            </div>
            <div id="sheet-color-preview" class="color-preview"></div>
        </div>
        
        <hr class="divider">

        <div class="stat-row">
            <span class="stat-label">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.2c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.46 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
                </svg>
                Total Pixels:
            </span>
            <span id="sheet-total-pixels" class="stat-value">0</span>
        </div>

        <div class="breakdown-section">
            <div class="breakdown-header">
                <span>Top Colors:</span>
                <span id="sheet-color-count-sub" class="sub-text"></span>
            </div>
            <div id="sheet-colors-list" class="horizontal-scroll"></div>
        </div>
    </div>

    <script src="geohash.js"></script>
    <script src="app.js"></script>
</body>
</html>
